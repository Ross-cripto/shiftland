  <script>
    (() => {
      const timeline = gsap.timeline({ paused: true });
      const reviewTime = 3.5;
      const moveTime = 7.5;
      const previewTime = 11.5;
      const returnTime = 15.5;

      function pressShortcut(current, previous, time) {
        const entranceTime = time - 0.68;
        if (previous) timeline.to(previous, { opacity: 0, duration: 0.18 }, entranceTime);
        timeline.fromTo(current, { y: 14, opacity: 0 }, {
          y: 0, opacity: 1, duration: 0.26, ease: "power3.out"
        }, entranceTime + 0.12);
        timeline.to(current + " kbd", {
          scale: 0.87, backgroundColor: "#8bb7e8", color: "#101722",
          duration: 0.10, repeat: 1, yoyo: true, ease: "power2.inOut"
        }, time - 0.10);
      }

      function showDesk(entering, exiting, time, direction = 1) {
        timeline.to(exiting, { x: -direction * 110, opacity: 0, duration: 0.23, ease: "power2.in" }, time);
        timeline.fromTo(entering, { x: direction * 120, opacity: 0 }, {
          x: 0, opacity: 1, duration: 0.46, ease: "power3.out", immediateRender: false
        }, time + 0.08);
      }

      function showState(bar, label, previousBar, previousLabel, time, application) {
        timeline.set(previousBar, { opacity: 0 }, time);
        timeline.set(bar, { opacity: 1 }, time);
        timeline.set(".desktop", { attr: { "data-application": application } }, time);
        if (label !== previousLabel) {
          timeline.set(previousLabel, { opacity: 0 }, time + 0.12);
          timeline.set(label, { opacity: 1 }, time + 0.12);
        }
      }

      timeline.fromTo(".set", { scale: 0.98 }, { scale: 1.015, duration: reviewTime, ease: "sine.inOut" }, 0);

      timeline.to(".opening-branch", { opacity: 0, duration: 0.18 }, reviewTime - 0.68);
      pressShortcut(".shortcut-review", null, reviewTime);
      showState("#bar-review", ".label-review", "#bar-code", ".label-code", reviewTime, "safari");
      showDesk(".review-desk", ".code-desk", reviewTime);
      timeline.to(".set", { scale: 0.985, duration: moveTime - reviewTime, ease: "sine.inOut" }, reviewTime);

      pressShortcut(".shortcut-move", ".shortcut-review", moveTime);
      timeline.to(".browser", { borderColor: "#8bb7e8", duration: 0.19 }, moveTime - 0.26);
      showState("#bar-moved", ".label-review", "#bar-review", ".label-review", moveTime, "notes");
      timeline.to(".browser", { x: -820, opacity: 0, duration: 0.38, ease: "power3.in" }, moveTime);
      timeline.set(".review-desk", { attr: { "data-layout": "notes" } }, moveTime + 0.38);
      timeline.to(".set", { scale: 1.02, duration: previewTime - moveTime, ease: "sine.inOut" }, moveTime);

      pressShortcut(".shortcut-preview", ".shortcut-move", previewTime);
      showState("#bar-preview", ".label-preview", "#bar-moved", ".label-review", previewTime, "safari");
      timeline.to(".notes", { x: -120, opacity: 0, duration: 0.23, ease: "power2.in" }, previewTime);
      timeline.set(".review-desk", { attr: { "data-layout": "browser" } }, previewTime + 0.2);
      timeline.fromTo(".browser", { x: 120, opacity: 0 }, {
        x: 0, opacity: 1, duration: 0.46, ease: "power3.out", immediateRender: false
      }, previewTime + 0.21);
      timeline.to(".set", { scale: 0.985, duration: returnTime - previewTime, ease: "sine.inOut" }, previewTime);

      pressShortcut(".shortcut-return", ".shortcut-preview", returnTime);
      showState("#bar-return", ".label-code", "#bar-preview", ".label-preview", returnTime, "code");
      timeline.set(".terminal-status", { opacity: 0 }, returnTime);
      timeline.set(".terminal-summary", { opacity: 1 }, returnTime);
      showDesk(".code-desk", ".review-desk", returnTime, -1);
      timeline.to(".set", { scale: 1.015, duration: 2.65, ease: "sine.inOut" }, returnTime);

      window.__timelines["workspace-switch"] = timeline;
    })();
  </script>
