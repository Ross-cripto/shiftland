name: macOS app

# Every change to the app is tested and packaged. A GitHub release with
# Shiftland.dmg, Shiftland.zip, and their checksums is published when:
#   - a push to main carries a CFBundleShortVersionString in Info.plist that has
#     no v<version> tag yet. The workflow creates the tag with the release.
#   - a tag such as v0.2.0 is pushed.
# Versions with a suffix, such as v0.2.0-beta.1, become prereleases.
#
# Releases are signed with Developer ID and notarized by Apple when all five
# APPLE_* repository secrets are set. README.md explains how to create them.
# Without them, releases are signed ad hoc and macOS asks people to approve
# Shiftland in System Settings the first time they open it.

on:
  # No path filter on push, so a release tag always starts a build.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "macos/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and package
    # Matches the toolchain Shiftland is verified with: Xcode 16.4 and the
    # macOS 15 SDK. The app still runs on newer macOS versions.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notarized: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          release=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            release=true
          else
            tag="v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' macos/Resources/Info.plist)"
            if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
              status=0
              git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
              case "$status" in
                0) echo "$tag is already released, so this build is not published." ;;
                2) release=true ;;
                *) echo "::error::Could not check whether $tag exists."; exit 1 ;;
              esac
            fi
          fi
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Versions look like 1.2.3 or 1.2.3-beta.1, and tags like v1.2.3, not $tag."
            exit 1
          fi
          if [[ -n "${BASH_REMATCH[2]}" ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "release=$release"
            echo "tag=$tag"
            echo "version=${BASH_REMATCH[1]}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        id: signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          configured=0
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            if [[ -n "${!name}" ]]; then configured=$((configured + 1)); fi
          done
          if ((configured != 0 && configured != 5)); then
            echo "::error::Set all five APPLE_* signing secrets, or none of them."
            exit 1
          fi
          # Only published releases are signed and notarized.
          if ((configured == 5)) && [[ "$RELEASE" == true ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [[ "$RELEASE" == true ]]; then
              echo "::warning::This release is signed ad hoc because the APPLE_* secrets are not set."
            fi
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test --package-path macos -j 2 --filter WorkspaceBarTests

      - name: Import Developer ID certificate
        id: certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/shiftland-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            security find-identity -v -p codesigning "$keychain"
            echo "::error::APPLE_CERTIFICATE_P12 has no valid Developer ID Application certificate and private key."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          SHIFTLAND_CONFIGURATION: release
          SHIFTLAND_UNIVERSAL: "1"
          SHIFTLAND_VERSION: ${{ steps.version.outputs.version }}
          SHIFTLAND_BUILD_NUMBER: ${{ github.run_number }}
          SHIFTLAND_SIGN_IDENTITY: ${{ steps.certificate.outputs.identity || '-' }}
        run: |
          ./scripts/build-app.sh
          lipo -archs .build/Shiftland.app/Contents/MacOS/Shiftland
          codesign --display --verbose=2 .build/Shiftland.app

      - name: Package and notarize
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SHIFTLAND_SIGN_IDENTITY: ${{ steps.certificate.outputs.identity || '-' }}
          APPLE_NOTARY_KEY: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_NOTARY_KEY || '' }}
          SHIFTLAND_NOTARY_KEY_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_NOTARY_KEY_ID || '' }}
          SHIFTLAND_NOTARY_ISSUER_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.APPLE_NOTARY_ISSUER_ID || '' }}
        run: |
          if [[ "$SIGNING_ENABLED" == true ]]; then
            export SHIFTLAND_NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
            printf '%s\n' "$APPLE_NOTARY_KEY" > "$SHIFTLAND_NOTARY_KEY_PATH"
          fi
          ./scripts/package-app.sh

      - name: Remove signing credentials
        if: always() && steps.certificate.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.certificate.outputs.keychain }}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: shiftland-macos
          path: .build/dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shiftland-macos
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Shiftland.dmg
            dist/Shiftland.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          NOTARIZED: ${{ needs.build.outputs.notarized }}
        run: |
          {
            echo "## Install"
            echo
            echo "1. Download **Shiftland.dmg**, open it, and drag Shiftland to Applications."
            echo "2. Open Shiftland from Applications. Follow the connection window to install a compatible version of OmniWM or enable IPC."
            echo "3. Click a workspace in the menu bar to switch to it. See the [installation and compatibility guide](https://ross-cripto.github.io/shiftland/install/) for help."
            if [[ "$NOTARIZED" != true ]]; then
              echo
              echo "> [!IMPORTANT]"
              echo "> This build is signed ad hoc. If macOS blocks the first launch, go to **System Settings → Privacy & Security**, click **Open Anyway** for Shiftland, and confirm."
              echo "> See [Apple's first-launch instructions](https://support.apple.com/en-us/102445) for details."
            fi
            echo
            echo "## Verify the download"
            echo
            echo '```sh'
            echo "shasum -a 256 -c SHA256SUMS.txt"
            echo "gh attestation verify Shiftland.dmg --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
          } > notes.md

          # A pushed tag already exists. Otherwise the release creates the tag
          # on the commit this run built.
          options=(--verify-tag)
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then options=(--target "$GITHUB_SHA"); fi
          if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease); fi
          gh release create "$TAG" \
            dist/Shiftland.dmg dist/Shiftland.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shiftland ${TAG#v}" \
            --notes-file notes.md \
            --generate-notes \
            "${options[@]}"
